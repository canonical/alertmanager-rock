summary: Run goss tests

environment:
  GOSS_FILE: "../../../goss.yaml"

execute: |
  mkdir data
  sudo chown 584792:584792 data

  # The volume mounts should ideally match the ones defined in the charm
  # https://github.com/canonical/alertmanager-k8s-operator/blob/main/charmcraft.yaml
  dgoss run -v "$(pwd)/data":/alertmanager rockcraft-test:latest
